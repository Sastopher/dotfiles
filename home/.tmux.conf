# ════════════════════════════════════════════════════════════════════════════
#  tmux config
#  reload after changes:  prefix + M-a  (or)  tmux source-file ~/.tmux.conf
# ════════════════════════════════════════════════════════════════════════════

# ── Terminal, color & modern keys ───────────────────────────────────────────
# tmux-256color advertises 256-color + italics to programs running inside tmux.
set -g default-terminal "tmux-256color"
# Tell tmux the OUTER terminal (Ghostty) supports true color (RGB) and the
# kitty/CSI-u extended-key protocol. `extkeys` is what makes Shift+Enter,
# Ctrl+Enter, etc. distinguishable — this is the half of the Shift+Enter fix
# that lives in tmux. The Ghostty half is automatic (native kitty protocol).
set -as terminal-features "xterm-ghostty:RGB:extkeys"
set -as terminal-features "xterm-256color:RGB:extkeys"
# Forward extended keys to programs (Claude Code) that request the protocol.
set -s extended-keys on
# Faster key sequencing (no lag after pressing Esc, important for vim).
set -sg escape-time 0
# Let editors/Claude know when a pane gains/loses focus.
set -g focus-events on

# ── Plugins (tpm) ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── Prefix key ──────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

# Double-tap the prefix (M-a M-a) or prefix+a to jump to the last window
bind a last-window
bind M-a last-window

# Allow holding alt to tap windows
bind M-p previous-window
bind M-n next-window

# Reload config
bind r source-file ~/.tmux.conf \; display "  config reloaded"
bind M-r source-file ~/.tmux.conf \; display "  config reloaded"

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Keep new windows in the current path too
bind c new-window -c "#{pane_current_path}"

# prefix + Tab → cycle to the next pane
bind Tab select-pane -t :.+

# ── Session persistence (resurrect + continuum) ─────────────────────────────
set -g @continuum-save-interval '15'   # auto-save every 15 min
set -g @continuum-restore 'off'        # don't auto-restore on tmux start (set 'on' to enable)
set -g @resurrect-capture-pane-contents 'on'

# ── General behaviour / QoL ─────────────────────────────────────────────────
set -g base-index 1               # windows start at 1
setw -g pane-base-index 1         # panes start at 1
set -g renumber-windows on        # keep window numbers gapless when one closes
set -g history-limit 50000        # bigger scrollback
set -g display-time 2000          # status messages linger 2s
set -g display-panes-time 2000    # pane numbers (prefix+q) linger 2s
set -g set-clipboard on           # let programs set the system clipboard (OSC52)
set -g status-keys emacs          # emacs-style editing at the command prompt

# Constrain window size to the largest client viewing THAT window (not session)
setw -g aggressive-resize on

# Mouse + vi copy mode
setw -g mouse on
setw -g mode-keys vi

# ── Copy mode → macOS clipboard ─────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ════════════════════════════════════════════════════════════════════════════
#  Status bar — Catppuccin Mocha, hand-rolled (no theme-plugin ordering issues)
# ════════════════════════════════════════════════════════════════════════════
# Palette:  base #1e1e2e  surface0 #313244  overlay0 #6c7086  text #cdd6f4
#           blue #89b4fa  mauve #cba6f7  peach #fab387  green #a6e3a1  yellow #f9e2af

# prefix-highlight pill (shows when you've hit the prefix / in copy mode)
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_prefix_prompt ' WAIT '
set -g @prefix_highlight_copy_prompt ' COPY '
set -g @prefix_highlight_sync_prompt ' SYNC '
set -g @prefix_highlight_empty_prompt ''
set -g @prefix_highlight_fg '#1e1e2e'
set -g @prefix_highlight_bg '#fab387'
set -g @prefix_highlight_copy_mode_attr 'fg=#1e1e2e,bg=#a6e3a1,bold'
set -g @prefix_highlight_sync_mode_attr 'fg=#1e1e2e,bg=#f38ba8,bold'

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name pill
set -g status-left-length 50
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]"

# Windows (inactive dim, active = mauve powerline pill)
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I #[fg=#cdd6f4]#W#F "
set -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W#F #[fg=#cba6f7,bg=#1e1e2e]"

# Right: prefix pill · clock · hostname
set -g status-right-length 80
set -g status-right "#{prefix_highlight}#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] %a %d %b  %H:%M #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] #h "

# Pane borders & messages
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines single
set -g message-style "fg=#1e1e2e,bg=#f9e2af,bold"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
set -g mode-style "fg=#1e1e2e,bg=#f9e2af"

# ── Keep this at the bottom ──────────────────────────────────────────────────
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
