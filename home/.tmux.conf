# ════════════════════════════════════════════════════════════════════════════
#  tmux config
#  reload after changes:  prefix + M-a  (or)  tmux source-file ~/.tmux.conf
# ════════════════════════════════════════════════════════════════════════════

# ── Terminal, color & modern keys ───────────────────────────────────────────
# tmux-256color advertises 256-color + italics to programs running inside tmux.
set -g default-terminal "tmux-256color"
# Tell tmux the OUTER terminal (Ghostty) supports true color (RGB) and the
# kitty/CSI-u extended-key protocol. `extkeys` is what makes Shift+Enter,
# Ctrl+Enter, etc. distinguishable — this is the half of the Shift+Enter fix
# that lives in tmux. The Ghostty half is automatic (native kitty protocol).
set -as terminal-features "xterm-ghostty:RGB:extkeys"
set -as terminal-features "xterm-256color:RGB:extkeys"
# Forward extended keys to programs (Claude Code) that request the protocol.
set -s extended-keys on
# Faster key sequencing (no lag after pressing Esc, important for vim).
set -sg escape-time 0
# Let editors/Claude know when a pane gains/loses focus.
set -g focus-events on

# ── Plugins (tpm) ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── Prefix key ──────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

# Double-tap the prefix (M-a M-a) or prefix+a to jump to the last window
bind a last-window
bind M-a last-window

# Allow holding alt to tap windows
bind M-p previous-window
bind M-n next-window

# Reload config
bind r source-file ~/.tmux.conf \; display "  config reloaded"
bind M-r source-file ~/.tmux.conf \; display "  config reloaded"

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Keep new windows in the current path too
bind c new-window -c "#{pane_current_path}"

# prefix + Tab → cycle to the next pane
bind Tab select-pane -t :.+

# prefix + @ → move the current pane into another window (e.g. "3" or "work:2")
bind @ command-prompt -p "join pane to:" "join-pane -t '%%'"

# ── Session persistence (resurrect + continuum) ─────────────────────────────
set -g @continuum-save-interval '15'   # auto-save every 15 min
set -g @continuum-restore 'off'        # don't auto-restore on tmux start (set 'on' to enable)
set -g @resurrect-capture-pane-contents 'on'

# ── General behaviour / QoL ─────────────────────────────────────────────────
set -g base-index 1               # windows start at 1
setw -g pane-base-index 1         # panes start at 1
set -g renumber-windows on        # keep window numbers gapless when one closes
set -g history-limit 50000        # bigger scrollback
set -g display-time 2000          # status messages linger 2s
set -g display-panes-time 2000    # pane numbers (prefix+q) linger 2s
set -g set-clipboard on           # let programs set the system clipboard (OSC52)
set -g status-keys emacs          # emacs-style editing at the command prompt

# Constrain window size to the largest client viewing THAT window (not session)
setw -g aggressive-resize on

# Mouse + vi copy mode
setw -g mouse on
setw -g mode-keys vi

# ── Copy mode → macOS clipboard ─────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ════════════════════════════════════════════════════════════════════════════
#  Status bar — Catppuccin Mocha, hand-rolled (no theme-plugin ordering issues)
# ════════════════════════════════════════════════════════════════════════════
# Palette:  base #1e1e2e  surface0 #313244  overlay0 #6c7086  text #cdd6f4
#           blue #89b4fa  mauve #cba6f7  peach #fab387  green #a6e3a1  yellow #f9e2af

# prefix-highlight pill (shows when you've hit the prefix / in copy mode)
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_prefix_prompt ' WAIT '
set -g @prefix_highlight_copy_prompt ' COPY '
set -g @prefix_highlight_sync_prompt ' SYNC '
set -g @prefix_highlight_empty_prompt ''
set -g @prefix_highlight_fg '#1e1e2e'
set -g @prefix_highlight_bg '#fab387'
set -g @prefix_highlight_copy_mode_attr 'fg=#1e1e2e,bg=#a6e3a1,bold'
set -g @prefix_highlight_sync_mode_attr 'fg=#1e1e2e,bg=#f38ba8,bold'

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name pill
set -g status-left-length 50
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]"

# Windows (inactive dim, active = mauve powerline pill)
set -g window-status-separator ""
# Window colors follow Claude state (see the Claude section below): peach = waiting on you,
# green name = finished and not yet seen, blue name = working.
set -g window-status-format "#{?#{==:#{@claude_win},waiting},#[fg=#1e1e2e#,bg=#fab387#,bold] #I #W#F#{E:@wrap_glyph} #[default],#[fg=#6c7086#,bg=#1e1e2e] #I #[fg=#{?#{==:#{@claude_win},done},#a6e3a1,#{?#{==:#{@claude_win},working},#89b4fa,#cdd6f4}}]#W#F#{E:@wrap_glyph} }"
set -g window-status-current-format "#[fg=#{?#{==:#{@claude_win},waiting},#fab387,#cba6f7},bg=#1e1e2e]#[fg=#1e1e2e,bg=#{?#{==:#{@claude_win},waiting},#fab387,#cba6f7},bold] #I #W#F#{E:@wrap_glyph} #[fg=#{?#{==:#{@claude_win},waiting},#fab387,#cba6f7},bg=#1e1e2e]"

# Right: prefix pill · clock
set -g status-right-length 80
set -g status-right "#{prefix_highlight}#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] %a %d %b  %H:%M "

# Pane borders & messages
# A status line on top of each pane gives every pane its own border to color. It carries text only
# when useful: "waiting", or the folder for panes with no title of their own.
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{@claude_state},waiting},#[fg=#1e1e2e#,bg=#fab387#,bold] waiting #[default],}#{E:@wrap_pill}#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#[fg=#6c7086] #{b:pane_current_path} ,}"
set -g pane-border-style "#{?#{==:#{@claude_state},waiting},fg=#fab387,fg=#313244}"
set -g pane-active-border-style "#{?#{==:#{@claude_state},waiting},fg=#fab387,fg=#89b4fa}"
set -g pane-border-lines single
set -g message-style "fg=#1e1e2e,bg=#f9e2af,bold"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
set -g mode-style "fg=#1e1e2e,bg=#f9e2af"

# ── Claude Code session state ───────────────────────────────────────────────
# ~/.claude/hooks/tmux-state.sh, run from Claude hooks, sets @claude_state on a pane and
# @claude_win on its window: waiting (on you), done (finished, not yet seen) or working.
# "done" clears when its window comes into view.
set-hook -g session-window-changed 'run-shell -b "~/.claude/hooks/tmux-state.sh viewed #{window_id}"'
set-hook -g client-session-changed 'run-shell -b "~/.claude/hooks/tmux-state.sh viewed #{window_id}"'
# prefix + Space → the Claude pane that has waited longest (replaces the default next-layout;
# layouts are still on prefix + M-1..5)
bind Space run-shell "~/.claude/hooks/tmux-state.sh next #{pane_id}"
# prefix + W → send /wrap to the Claude session in this pane (wrap-send.sh; `wrap-send --pick`
# from a shell picks other sessions). Its verdict shows on the pane border and, as a glyph after
# the window name, in the window list (✓ safe to quit, ? needs you, ‖ parked, … in progress)
# until the session's next prompt.
bind W run-shell -b "~/.claude/hooks/wrap-send.sh --notify #{pane_id}"
set -g @wrap_glyph "#{?#{==:#{@claude_wrap_win},quit}, ✓,#{?#{==:#{@claude_wrap_win},you}, ?,#{?#{==:#{@claude_wrap_win},parked}, ‖,#{?#{==:#{@claude_wrap_win},progress}, …,}}}}"
set -g @wrap_pill "#{?#{@claude_wrap},#[fg=#1e1e2e#,bg=#{?#{==:#{@claude_wrap},quit},#a6e3a1,#{?#{==:#{@claude_wrap},you},#fab387,#{?#{==:#{@claude_wrap},parked},#f9e2af,#89b4fa}}}#,bold] wrap: #{?#{==:#{@claude_wrap},quit},safe to quit,#{?#{==:#{@claude_wrap},you},needs you,#{?#{==:#{@claude_wrap},parked},parked,in progress}}} #[default],}"

# ── Keep this at the bottom ──────────────────────────────────────────────────
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
