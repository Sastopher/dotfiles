# ════════════════════════════════════════════════════════════════════════════
#  psmux config — the Windows port of home/.tmux.conf
#  Loaded via the ~/.psmux.conf stub that windows/install.ps1 writes
#  (psmux reads ~/.psmux.conf before ~/.tmux.conf).
#  reload after changes:  prefix + r
#
#  Same prefix, bindings and Catppuccin status bar as the mac. Left out:
#  Ghostty terminal-features, tpm (the pain-control bindings are inlined
#  below instead), pbcopy (psmux yanks to the Windows clipboard itself), and
#  the Claude Code pane-state hooks, which are bash scripts.
# ════════════════════════════════════════════════════════════════════════════

# ── Terminal & keys ─────────────────────────────────────────────────────────
# No extended-keys line: psmux passes Shift+Enter etc. through on its own.
# psmux recommends 50 over tmux's usual 0 so ConPTY escape sequences aren't split.
set -sg escape-time 50
set -g focus-events on
# Don't dim predicted text — it fights with nvim's own redraws.
set -g prediction-dimming off

# ── Prefix key ──────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

# Double-tap the prefix (M-a M-a) or prefix+a to jump to the last window
bind a last-window
bind M-a last-window

# Allow holding alt to tap windows
bind M-p previous-window
bind M-n next-window

# Reload config
bind r source-file ~/.psmux.conf \; display "  config reloaded"
bind M-r source-file ~/.psmux.conf \; display "  config reloaded"

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Keep new windows in the current path too
bind c new-window -c "#{pane_current_path}"

# prefix + Tab → cycle to the next pane
bind Tab select-pane -t :.+

# prefix + @ → move the current pane into another window (e.g. "3" or "work:2")
bind @ command-prompt -p "join pane to:" "join-pane -t '%%'"

# ── tmux-pain-control, inlined ──────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# ── General behaviour / QoL ─────────────────────────────────────────────────
set -g base-index 1               # windows start at 1
setw -g pane-base-index 1         # panes start at 1
set -g renumber-windows on        # keep window numbers gapless when one closes
set -g history-limit 50000        # bigger scrollback
set -g display-time 2000          # status messages linger 2s
set -g display-panes-time 2000    # pane numbers (prefix+q) linger 2s
set -g set-clipboard on           # let programs set the system clipboard (OSC52)
set -g status-keys emacs          # emacs-style editing at the command prompt
setw -g aggressive-resize on

# Mouse + vi copy mode
setw -g mouse on
setw -g mode-keys vi

# ── Copy mode → Windows clipboard ───────────────────────────────────────────
# psmux's yank already lands on the Windows clipboard; these just match the
# mac's vi-style keys (v starts a selection rather than toggling rectangle).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# ════════════════════════════════════════════════════════════════════════════
#  Status bar — Catppuccin Mocha, same as the mac
# ════════════════════════════════════════════════════════════════════════════
# Palette:  base #1e1e2e  surface0 #313244  overlay0 #6c7086  text #cdd6f4
#           blue #89b4fa  mauve #cba6f7  peach #fab387  green #a6e3a1  yellow #f9e2af

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name pill
set -g status-left-length 50
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]"

# Windows (inactive dim, active = mauve powerline pill)
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I #[fg=#cdd6f4]#W#F "
set -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W#F #[fg=#cba6f7,bg=#1e1e2e]"

# Right: prefix/copy pill (what tmux-prefix-highlight drew on the mac) · clock
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#1e1e2e#,bg=#fab387#,bold] WAIT #[default],}#{?pane_in_mode,#[fg=#1e1e2e#,bg=#a6e3a1#,bold] COPY #[default],}#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] %a %d %b  %H:%M "

# Pane borders & messages — each pane shows its folder on its top border
set -g pane-border-status top
# psmux expands only a few variables in border labels (#{pane_index} and
# #{pane_title} work; #{pane_current_path}, #{b:...} and #[fg=...] are drawn
# literally). windows/profile.ps1 sets the pane title to the current folder
# on every prompt, so the title stands in for the path.
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines single
set -g message-style "fg=#1e1e2e,bg=#f9e2af,bold"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
set -g mode-style "fg=#1e1e2e,bg=#f9e2af"
